name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # stdlib only: no install step, no secrets, no network (tests mock every
      # provider child and HTTP call).
      - run: python -m unittest discover -s tests -t . -v
