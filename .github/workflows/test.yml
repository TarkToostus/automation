name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No secrets, no network (tests mock every provider child and HTTP call).
      # The suite is stdlib unittest; test_sales_followup.py alone is written for
      # pytest (fixtures, parametrize), so pytest is installed and runs it too.
      - run: python -m pip install pytest==8.3.5
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m pytest tests/test_sales_followup.py -v
